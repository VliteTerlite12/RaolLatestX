name: Auto Merge PR + Delete Branch

on:
  pull_request:
    types: [opened, reopened, synchronize]

  workflow_dispatch:

jobs:
  # ─── Auto-merge PR baru ───
  auto-merge-new:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor == 'VliteTerlite12'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge + Delete Branch
        run: |
          gh pr merge "$PR_URL" \
            --squash \
            --auto \
            --delete-branch
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Bulk merge semua open PR (trigger manual) ───
  bulk-merge-all:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge semua open PR + hapus branch
        run: |
          REPO="${{ github.repository }}"

          echo "🔍 Mengambil open PR dari $REPO..."

          PR_NUMBERS=$(gh pr list \
            --repo "$REPO" \
            --state open \
            --limit 100 \
            --json number \
            -q '.[].number')

          if [ -z "$PR_NUMBERS" ]; then
            echo "✅ Tidak ada open PR."
            exit 0
          fi

          for PR in $PR_NUMBERS; do
            echo "⏳ Merging PR #$PR..."
            gh pr merge "$PR" \
              --repo "$REPO" \
              --squash \
              --delete-branch \
            && echo "✅ PR #$PR merged" || echo "❌ PR #$PR gagal (conflict?)"
            sleep 2
          done

          echo "🎉 Selesai!"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
